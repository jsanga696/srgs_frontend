<div class="page-container">

  <div class="header">
    <h4>Asegurados</h4>

    <div class="card-header">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          placeholder="Buscar por identificación..."
          [(ngModel)]="filtroIdentificacion"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          placeholder="Buscar por nombres..."
          [(ngModel)]="filtroNombres"
        />
      </mat-form-field>
      
      <button mat-raised-button color="primary"
              routerLink="/asegurados/nuevo">
        Nuevo asegurado
      </button>
    </div>    
  </div>

    <div class="card-body">

      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="identificacion">
            <th mat-header-cell *matHeaderCellDef> Identificación </th>
            <td mat-cell *matCellDef="let v"> {{ v.identificacion }} </td>
        </ng-container>

        <ng-container matColumnDef="nombres">
            <th mat-header-cell *matHeaderCellDef> Nombres </th>
            <td mat-cell *matCellDef="let v"> {{ v.nombres }} </td>
        </ng-container>

        <ng-container matColumnDef="empresa">
            <th mat-header-cell *matHeaderCellDef> Aseguradora </th>
            <td mat-cell *matCellDef="let v"> {{ v.empresa.nombre }} </td>
        </ng-container>

        <ng-container matColumnDef="direccion">
            <th mat-header-cell *matHeaderCellDef> Dirección </th>
            <td mat-cell *matCellDef="let v"> {{ v.direccion }} </td>
        </ng-container>

        <ng-container matColumnDef="fecha_creacion">
            <th mat-header-cell *matHeaderCellDef> F. Creación </th>
            <td mat-cell *matCellDef="let v"> {{ v.fecha_creacion }} </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let v">

            <button mat-icon-button color="primary" (click)="editar(v)">
            <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="primary" (click)="verDetalle(v)">
            <mat-icon>visibility</mat-icon>
            </button>

        </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator 
          [length]="totalElements"
          [pageSize]="10"
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
          (page)="onPageChange($event)">
        </mat-paginator>
    </div>

</div>
