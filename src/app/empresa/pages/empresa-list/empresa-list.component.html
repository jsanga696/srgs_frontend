<div class="header-actions">
  <button mat-raised-button color="primary" routerLink="/empresas/nuevo">
    + Nueva aseguradora
  </button>
</div>

<table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="ruc">
        <th mat-header-cell *matHeaderCellDef>RUC</th>
        <td mat-cell *matCellDef="let e">{{ e.ruc }}</td>
    </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let e">{{ e.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="razon_social">
    <th mat-header-cell *matHeaderCellDef>Razón Social</th>
    <td mat-cell *matCellDef="let e">{{ e.razon_social }}</td>
  </ng-container>

  <ng-container matColumnDef="celular">
        <th mat-header-cell *matHeaderCellDef>Celular</th>
        <td mat-cell *matCellDef="let e">{{ e.celular }}</td>
    </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let e">{{ e.email }}</td>
  </ng-container>

  <ng-container matColumnDef="direccion">
    <th mat-header-cell *matHeaderCellDef>Dirección</th>
    <td mat-cell *matCellDef="let e">{{ e.direccion }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let e">
      <button mat-icon-button color="primary"
        [routerLink]="['/empresas/editar', e.id]">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
