<div class="page-container">

  <h1 class="title" >Vehículos</h1>

  <div class="card">

    <div class="card-header">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          placeholder="Buscar por placa..."
          [(ngModel)]="filtroPlaca"
          (keyup)="buscarAuto()"
        />
      </mat-form-field>
    </div>

    <div class="card-body">

      <table mat-table [dataSource]="dataSource">

        <!-- PLACA -->
        <ng-container matColumnDef="placa">
            <th mat-header-cell *matHeaderCellDef> Placa </th>
            <td mat-cell *matCellDef="let v"> {{ v.placa }} </td>
        </ng-container>

        <!-- MARCA -->
        <ng-container matColumnDef="marca">
            <th mat-header-cell *matHeaderCellDef> Marca </th>
            <td mat-cell *matCellDef="let v"> {{ v.marca }} </td>
        </ng-container>

        <!-- MODELO -->
        <ng-container matColumnDef="modelo">
            <th mat-header-cell *matHeaderCellDef> Modelo </th>
            <td mat-cell *matCellDef="let v"> {{ v.modelo }} </td>
        </ng-container>

        <!-- COLOR -->
        <ng-container matColumnDef="color">
            <th mat-header-cell *matHeaderCellDef> Color </th>
            <td mat-cell *matCellDef="let v"> {{ v.color }} </td>
        </ng-container>

        <ng-container matColumnDef="propietario">
            <th mat-header-cell *matHeaderCellDef> Propietario </th>
            <td mat-cell *matCellDef="let v"> {{ v.asegurado?.nombres }} </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let v">

              <button mat-icon-button color="primary" (click)="verDetalle(v)">
              <mat-icon>visibility</mat-icon>
              </button>

          </td>
        </ng-container>

        <!-- HEADER + ROWS -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator 
          [length]="totalElements"
          [pageSize]="10"
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
          (page)="onPageChange($event)">
        </mat-paginator>
        
    </div>

  </div>

</div>
