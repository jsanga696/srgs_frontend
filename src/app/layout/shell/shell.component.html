<div class="overlay" *ngIf="loading">
  <mat-progress-spinner
    mode="indeterminate"
    diameter="60">
  </mat-progress-spinner>
</div>

<mat-sidenav-container class="container">

  <mat-sidenav
    mode="side"
    [opened]="true"
    [style.width.px]="isCollapsed ? 70 : 220"
    class="sidenav">

    <!-- HEADER -->
    <div class="sidebar-header">
      <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>

      <span *ngIf="!isCollapsed">SRGS</span>
    </div>

    <mat-nav-list>

      <a mat-list-item routerLink="/empresas" matTooltip="Empresas" matTooltipPosition="right"
  matTooltipShowDelay="300">
        <mat-icon matListItemIcon>markunread_mailbox</mat-icon>
        <span>Aseguradoras</span>
      </a>

      <a mat-list-item routerLink="/asegurados" matTooltip="Asegurados" matTooltipPosition="right"
  matTooltipShowDelay="300">
        <mat-icon matListItemIcon>person</mat-icon>
        <span>Asegurados</span>
      </a>

      <a mat-list-item routerLink="/peritajes" matTooltip="Peritajes" matTooltipPosition="right"
  matTooltipShowDelay="300">
        <mat-icon matListItemIcon>search</mat-icon>
        <span>Peritajes</span>
      </a>

      <a mat-list-item routerLink="/siniestros" matTooltip="Siniestros" matTooltipPosition="right"
  matTooltipShowDelay="300">
        <mat-icon matListItemIcon>local_hospital</mat-icon>
        <span>Siniestros</span>
      </a>

      <a mat-list-item routerLink="/vehiculos" matTooltip="Vehículos" matTooltipPosition="right"
  matTooltipShowDelay="300">
        <mat-icon matListItemIcon>directions_car</mat-icon>
        <span>Vehiculos</span>
      </a>

      <a mat-list-item (click)="salir()" matTooltip="Salir" matTooltipPosition="right"
  matTooltipShowDelay="300">
        <mat-icon matListItemIcon>exit_to_app</mat-icon>
        <span>Salir</span>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar color="primary">
      <span>SRGS System</span>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
